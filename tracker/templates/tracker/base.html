<!DOCTYPE html>
<html lang="tr" data-bs-theme='light'>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finans Takip Sistemi</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                <i class="bi bi-wallet2"></i> Finans Takip Sistemi
            </a>
            <div class="d-flex align-items-center">
    {% if user.is_authenticated %}
        <span class="text-white me-3">Hoş geldin, {{ user.username }}!</span>
        
        
        <button type="button" class="btn btn-outline-light btn-sm me-3" id="darkModeToggle" onclick="toggleDarkMode()">
            <i class="bi bi-moon-fill" id="themeIcon"></i> <span id="themeText">Karanlık Mod</span>
        </button>

        <form action="{% url 'logout' %}" method="POST" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger btn-sm">Çıkış Yap</button>
        </form>
    {% endif %}
</div>



        </div>
    </nav>

    <!-- Mesajlar -->
    <div class="container mt-3">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-dismissible fade show shadow-sm {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'warning' %}alert-warning{% else %}alert-success{% endif %}" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <!-- İçerik -->
    <main class="container my-4">
        {% block content %}
        {% endblock %}
    </main>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

     <script>
    
    document.addEventListener("DOMContentLoaded", function() {
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
        updateThemeButton(savedTheme);
    });

    
    function toggleDarkMode() {
        const currentTheme = document.documentElement.getAttribute('data-bs-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

        document.documentElement.setAttribute('data-bs-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeButton(newTheme);
    }

    
    function updateThemeButton(theme) {
        const icon = document.getElementById('themeIcon');
        const text = document.getElementById('themeText');
        if (theme === 'dark') {
            if (icon) icon.className = "bi bi-sun-fill";
            if (text) text.innerText = "Aydınlık Mod";
        } else {
            if (icon) icon.className = "bi bi-moon-fill";
            if (text) text.innerText = "Karanlık Mod";
        }
    }
</script>
</body>
</html>
