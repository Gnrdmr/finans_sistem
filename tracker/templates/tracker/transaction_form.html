<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İşlem {{ action }}</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 40px;">

    <h2>İşlem {{ action }}</h2>
    
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <br>
        <button type="submit" style="background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">Kaydet</button>
    </form>
    
    <br><br>
    <a href="{% url 'home' %}" style="text-decoration: none; color: #007bff;">← Ana Sayfaya Geri Dön</a>

</body>
</html>
