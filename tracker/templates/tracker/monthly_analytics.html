<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Aylık Finansal Analiz ve İçgörüler</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 30px;">

    <h2>📈 Aylık Harcama Analizi ve Akıllı İçgörüler</h2>
    <a href="{% url 'home' %}">← Ana Sayfaya Geri Dön</a>
    
    <div style="margin-top: 20px;">
        <h3>🤖 Akıllı Finansal Asistan Raporu</h3>
        {% if insights %}
            <ul style="list-style-type: none; padding: 0;">
                {% for item in insights %}
                    <li style="padding: 12px; margin-bottom: 10px; border-radius: 5px; font-weight: bold;
                        {% if item.type == 'danger' %}
                            background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;
                        {% elif item.type == 'success' %}
                            background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;
                        {% else %}
                            background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb;
                        {% endif %}">
                        💡 {{ item.text }}
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>Karşılaştırma yapabilmek için yeterli geçmiş veri bulunmuyor.</p>
        {% endif %}
    </div>

</body>
</html>
